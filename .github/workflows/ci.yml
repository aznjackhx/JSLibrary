name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, unit tests, size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # qpdf validates generated PDFs against an independent implementation.
      # The conformance test fails rather than skips when it is missing in CI.
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle-size budget (core <= 60 KB gzip, fonts excluded)
        run: pnpm size
      - name: Strict-CSP guard (no eval / new Function)
        run: pnpm csp

  browser:
    name: browser tests (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          # WebKit on macOS: Safari's getClientRects behaviour differs subtly
          # from Chromium's, and that difference is load-bearing for this
          # library, so it is tested on the platform it actually ships on.
          - browser: webkit
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:browser --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
